[project]
name = "nexusagent"
version = "0.1.0"
description = "一个模块化、可扩展的 AI Agent 学习框架"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "chromadb>=0.5",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
